<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>uebmal.de</title>
<style>
:root{--paper:#f4f7f3;--card:#fff;--ink:#16302b;--muted:#5b6f6a;--line:#d5e0db;--green:#1f8a5b;--marker:#ffe36e}
@media (prefers-color-scheme: dark){:root{--paper:#0f1b18;--card:#182823;--ink:#e8f1ed;--muted:#9db3ac;--line:#2c423b;--green:#3fbf86;--marker:#e9c93d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{border-top:8px solid var(--green);padding:22px 0 8px}
h1{font-size:2rem;margin:0}
h1 span{background:var(--marker);color:#3a3200;padding:0 8px;border-radius:6px}
p.sub{color:var(--muted);margin:6px 0 0}
h2{font-size:1.1rem;margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
a.tile{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:inherit;text-decoration:none;min-height:96px}
a.tile:hover,a.tile:focus-visible{border-color:var(--green);outline:none}
a.tile b{font-size:1.1rem}
a.tile small{color:var(--muted)}
a.tile .f{color:var(--green);font-weight:700;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>üb</span> mal</h1>
    <p class="sub">Kurze Übungsrunden für die Schule.</p>
  </header>
  <h2>Englisch</h2>
  <div class="grid">
    <a class="tile" href="englisch/"><span class="f">Klasse 5 · Green Line 1</span><b>Schulaufgabe Unit 1</b><small>Grammar, Vocabulary, Writing, Listening</small></a>
  </div>
  <h2>Mathe</h2>
  <div class="grid">
    <a class="tile" href="mathe/"><span class="f">Klasse 5</span><b>Mission Riesenzahlen</b><small>Große Zahlen, Runden, Zahlenstrahl, negative Zahlen</small></a>
  </div>
</div>
</body>
</html>
