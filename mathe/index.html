/* Layout: ein Mathe-Heft auf Karopapier – dunkelblauer Umschlag mit Etikett, darunter die Stufenzahlen-Treppe und die Missionen als Zettel. Im Dunkelmodus wird das Heft zur Schultafel. */
:root {
  --paper: #F8FAFD;
  --grid: #DDE6F2;
  --ink: #1B2640;
  --ink-soft: #56627C;
  --cover: #1E3A6D;
  --cover-ink: #F2F6FD;
  --card: #FFFFFF;
  --line: #CBD6E6;
  --marker: #FFE45E;
  --marker-ink: #2E2600;
  --accent: #2B5FD9;
  --accent-ink: #FFFFFF;
  --good: #1D8556;
  --good-bg: #E2F4EA;
  --almost: #A85A10;
  --almost-bg: #FCEFDF;
  --shadow: 0 1px 0 rgba(27, 38, 64, .06), 0 8px 20px -10px rgba(27, 38, 64, .28);
  --f-display: "Shantell Sans", "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive;
  --f-body: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --cell: 20px;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1C2824; --grid: #27352F; --ink: #EAF0E8; --ink-soft: #A9B8AF;
    --cover: #13233D; --cover-ink: #E6EDF8; --card: #23312C; --line: #3B4D46;
    --marker: #F1CF4A; --marker-ink: #262000; --accent: #8DB3FF; --accent-ink: #0D1830;
    --good: #74D4A4; --good-bg: #1D3A2D; --almost: #F2AC62; --almost-bg: #3A2D1D;
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 10px 24px -12px rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1C2824; --grid: #27352F; --ink: #EAF0E8; --ink-soft: #A9B8AF;
  --cover: #13233D; --cover-ink: #E6EDF8; --card: #23312C; --line: #3B4D46;
  --marker: #F1CF4A; --marker-ink: #262000; --accent: #8DB3FF; --accent-ink: #0D1830;
  --good: #74D4A4; --good-bg: #1D3A2D; --almost: #F2AC62; --almost-bg: #3A2D1D;
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 10px 24px -12px rgba(0, 0, 0, .65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
sup { font-size: .62em; line-height: 0; position: relative; top: -.15em; vertical-align: super; font-weight: 800; }

/* Zahlen in Dreiergruppen */
.n { white-space: nowrap; font-variant-numeric: lining-nums; }
.n .g { margin-left: .22em; }
.hl { background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 90%, transparent 90%); padding-inline: .1em; }

/* Umschlag + Etikett */
.cover { background: var(--cover); color: var(--cover-ink); padding-inline: 16px; padding-block: 18px 26px; }
.cover-in { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.label {
  background: var(--card); color: var(--ink); border-radius: 12px; padding: 14px 18px 16px;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--card) 70%, transparent), 0 0 0 5.5px var(--line);
  display: grid; gap: 10px; margin: 5px;
}
.label-row { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: .9rem; color: var(--ink-soft); }
.label-row b { color: var(--ink); font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; border-bottom: 1.5px dotted var(--line); padding-inline: 2px 10px; }
.name-lab { display: inline-flex; gap: 6px; align-items: baseline; }
.name-in { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; color: var(--ink); background: transparent; border: none; border-bottom: 1.5px dotted var(--line); padding: 0 2px; width: 10ch; }
.name-in::placeholder { color: var(--ink-soft); font-weight: 400; }
.name-in:focus { outline: none; border-bottom-color: var(--accent); }
.title { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.75rem, 6.2vw, 2.5rem); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.xp { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; }
.rank { font-weight: 800; font-size: .95rem; }
.rank small { display: block; font-weight: 600; color: var(--ink-soft); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
.xp-num { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.ruler {
  grid-column: 1 / -1; position: relative; height: 22px; border: 1.5px solid var(--ink-soft); border-radius: 4px;
  overflow: hidden; background: var(--paper);
}
.ruler .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--marker); transition: width .6s ease; }
.ruler::after {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 7px;
  background: repeating-linear-gradient(90deg, var(--ink-soft) 0 1px, transparent 1px 10%);
  opacity: .8;
}
.ruler::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; z-index: 1;
  background: repeating-linear-gradient(90deg, var(--ink-soft) 0 1px, transparent 1px 2%);
  opacity: .55;
}
.next-rank { grid-column: 1 / -1; font-size: .8rem; color: var(--ink-soft); }

/* Seitengerüst */
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 56px; display: grid; gap: 30px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-h { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; margin: 0; line-height: 1.15; text-wrap: balance; }
.sec-p { margin: 0; color: var(--ink-soft); max-width: 62ch; }

/* Stufenzahlen-Treppe */
.stairs-box { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.stairs { overflow-x: auto; padding-bottom: 4px; }
.stairs-in { display: flex; align-items: flex-end; gap: 4px; min-width: max-content; border-bottom: 2px solid var(--ink); padding-inline: 2px; }
.step {
  width: 44px; height: calc(30px + var(--i) * 8px); display: flex; align-items: flex-start; justify-content: center;
  padding-top: 6px; border: 1.5px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0;
  background: var(--paper); font-family: var(--f-display); font-weight: 700; font-size: .95rem; color: var(--ink);
  transition: background .15s, transform .15s;
}
.step:hover { background: color-mix(in srgb, var(--marker) 35%, var(--paper)); }
.step[aria-pressed="true"] { background: var(--marker); color: var(--marker-ink); border-color: var(--marker); }
.step-info { display: grid; gap: 4px; min-width: 0; }
.step-big { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.25rem, 5vw, 1.8rem); line-height: 1.2; overflow-wrap: anywhere; }
.step-meta { font-weight: 700; color: var(--ink-soft); }
.step-ex { margin: 0; }

/* Missions-Zettel */
.missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: 12px; }
.mtile {
  text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px;
  display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: start; box-shadow: var(--shadow);
  transition: transform .15s, border-color .15s; min-width: 0;
}
.mtile:hover { transform: translateY(-2px); border-color: var(--accent); }
.mbadge {
  grid-row: span 3; width: 58px; height: 58px; border-radius: 12px; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; line-height: 1; text-align: center;
  background: var(--paper); border: 1.5px dashed var(--line); color: var(--ink);
}
.mtile.done .mbadge { background: var(--marker); color: var(--marker-ink); border: 1.5px solid var(--marker); }
.mtitle { font-weight: 900; font-size: 1.05rem; line-height: 1.2; }
.mshort { font-size: .88rem; color: var(--ink-soft); line-height: 1.3; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
.dot.star { background: var(--good); border-color: var(--good); }
.dot.done { background: var(--marker); border-color: var(--almost); }
.dot.shown { background: var(--line); border-color: var(--ink-soft); }
.chip-next { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-left: 6px; }
.mtile.train { grid-column: 1 / -1; border-style: dashed; border-color: var(--accent); }
.mtile.train .mbadge { background: var(--accent); color: var(--accent-ink); border: none; font-size: 1.6rem; }
.bonus-note { font-size: .85rem; color: var(--ink-soft); margin: 0; }

/* Aufgaben-Ansicht */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1.5px solid var(--line); padding-inline: 16px; padding-block: 10px;
}
.topbar-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
.back { background: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 12px; font-weight: 800; min-height: 40px; }
.tb-title { font-weight: 900; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-count { font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pbar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .4s ease; }

.task { overflow-wrap: anywhere; hyphens: auto; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 16px; min-width: 0; }
.intro { background: color-mix(in srgb, var(--marker) 22%, var(--card)); border: 1.5px solid color-mix(in srgb, var(--marker) 70%, var(--line)); border-radius: 12px; padding: 12px 14px; margin: 0; font-size: .95rem; }
.intro b { font-family: var(--f-display); }
.story { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 0; }
.q { font-size: 1.22rem; font-weight: 700; line-height: 1.4; margin: 0; overflow-wrap: anywhere; hyphens: auto; }
.papa { border: 1.5px dashed var(--accent); border-radius: 10px; padding: 8px 12px; font-size: .92rem; color: var(--ink); }
.papa b { color: var(--accent); }

/* Eingaben */
.num-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.num-in {
  font-weight: 800; font-size: 1.6rem; letter-spacing: .03em; padding: 8px 14px; min-height: 56px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink);
  width: min(100%, 15ch); font-variant-numeric: tabular-nums;
}
.num-in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.sign { min-width: 56px; min-height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); font-size: 1.5rem; font-weight: 900; }
.sign[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.unit { font-weight: 700; color: var(--ink-soft); }
.echo { font-size: .95rem; color: var(--ink-soft); min-height: 1.5em; }
.echo b { color: var(--ink); font-size: 1.15rem; }
.tpl { font-size: 1.3rem; font-weight: 800; line-height: 2.4; overflow-wrap: anywhere; }
.slot { width: 3.4ch; min-height: 44px; font-weight: 800; font-size: 1.2rem; text-align: center; border: 2px solid var(--line); border-radius: 8px; background: var(--paper); padding: 2px; }
.slot.sup { width: 3ch; min-height: 36px; font-size: 1rem; vertical-align: super; }
.slot:focus { border-color: var(--accent); outline: none; }

.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; padding: 12px 14px; min-height: 52px; border: 2px solid var(--line); border-radius: 12px;
  background: var(--paper); font-weight: 700; display: flex; gap: 10px; align-items: center; transition: border-color .15s, background .15s;
}
.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; border: 1.5px solid var(--line); font-size: .85rem; font-weight: 900; color: var(--ink-soft); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--paper)); }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.no { border-color: var(--almost); background: var(--almost-bg); opacity: .75; }
.opts.letters { grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); }
.opts.letters .opt { justify-content: center; font-family: var(--f-display); font-size: 1.3rem; }

.cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.side { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 10px; text-align: center; font-weight: 800; font-size: 1.2rem; min-width: 0; overflow-wrap: anywhere; }
.side small { display: block; font-weight: 600; font-size: .78rem; color: var(--ink-soft); margin-top: 4px; line-height: 1.25; }
.hole { width: 52px; height: 52px; border-radius: 50%; border: 2.5px dashed var(--ink-soft); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; }
.hole.set { border-style: solid; border-color: var(--accent); color: var(--accent); }
.ops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.op { min-height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; }
.op[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
.op.no { border-color: var(--almost); background: var(--almost-bg); opacity: .7; }
.op.ok { border-color: var(--good); background: var(--good-bg); }
.papa { display: none; }
body.papa-on .papa { display: block; }

.order-row { display: grid; gap: 6px; counter-reset: pos; }
.slotline { display: flex; align-items: center; gap: 10px; min-height: 52px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px 10px; }
.slotline::before { counter-increment: pos; content: counter(pos) "."; font-family: var(--f-display); font-weight: 800; color: var(--ink-soft); width: 1.6em; flex: none; }
.slotline.filled { border-style: solid; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--paper)); }
.slotline button { flex: 1; text-align: left; background: none; border: none; font-weight: 800; padding: 6px 0; min-width: 0; }
.lt { text-align: center; font-family: var(--f-display); font-weight: 800; color: var(--ink-soft); line-height: 1; height: 10px; font-size: .9rem; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.card-n { padding: 10px 14px; min-height: 48px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); font-weight: 800; text-align: left; max-width: 100%; }
.card-n:hover { border-color: var(--accent); }
.card-n[disabled] { opacity: .25; cursor: default; border-style: dashed; }

.area { min-width: 0; display: grid; gap: 12px; }
.nl { width: 100%; max-width: 600px; height: auto; display: block; margin-inline: auto; }
.nl-wrap { overflow-x: auto; min-width: 0; }
.nl-axis, .nl-tick { stroke: var(--ink); fill: none; }
.nl-tick.minor { stroke: var(--ink-soft); }
.nl-head { fill: var(--ink); stroke: none; }
.nl-label { fill: var(--ink); font-family: var(--f-body); font-weight: 700; font-size: 22px; }
.nl-mark { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.nl-tip { fill: var(--accent); stroke: none; }
.nl-letter { fill: var(--accent); font-family: var(--f-display); font-weight: 800; font-size: 28px; }

/* Knöpfe + Rückmeldung */
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.btn { border-radius: 12px; padding: 10px 18px; min-height: 50px; font-weight: 900; border: 2px solid transparent; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; border: 1.5px solid; }
.fb[hidden] { display: none !important; }
.fb.good { background: var(--good-bg); border-color: var(--good); }
.fb.almost { background: var(--almost-bg); border-color: var(--almost); }
.fb.reveal { background: color-mix(in srgb, var(--accent) 8%, var(--card)); border-color: var(--accent); }
.fb-h { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fb-h .plus { font-family: var(--f-body); font-size: .85rem; font-weight: 900; color: var(--good); }
.fb p { margin: 0; }
.fb .sol { font-weight: 800; }
.hint { margin: 0; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--marker) 25%, var(--card)); font-size: .95rem; }

/* Abschluss */
.done-box { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 26px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.stamp {
  width: 132px; height: 132px; border-radius: 50%; border: 4px double var(--good); color: var(--good);
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; line-height: 1.1;
  transform: rotate(-8deg); animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
.stamp b { display: block; font-size: 2.2rem; }
@keyframes stamp { from { transform: rotate(-8deg) scale(1.8); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
.done-h { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; margin: 0; }
.done-p { margin: 0; max-width: 46ch; }
.rankup { background: var(--marker); color: var(--marker-ink); border-radius: 10px; padding: 8px 14px; font-weight: 900; }

/* Training */
.topics { display: flex; flex-wrap: wrap; gap: 8px; }
.topic { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-weight: 800; font-size: .9rem; }
.topic[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.streak { font-weight: 800; color: var(--ink-soft); font-size: .9rem; }

/* Fuß */
.foot-wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
.foot { display: grid; gap: 12px; border-top: 1.5px solid var(--line); padding-top: 18px; }
.toggles { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.switch { display: inline-flex; gap: 10px; align-items: center; background: none; border: none; font-weight: 800; padding: 4px 0; min-height: 44px; }
.switch .track { width: 46px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(20px); }
.foot small { color: var(--ink-soft); }
.linkish { background: none; border: none; color: var(--accent); font-weight: 800; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; }

@media (max-width: 520px) {
  .cmp { grid-template-columns: minmax(0, 1fr); }
  .hole { justify-self: center; }
}
@media (max-width: 480px) {
  body { font-size: 16px; }
  .task { padding: 16px; }
  .q { font-size: 1.12rem; }
  .op { font-size: 1.6rem; }
  .actions .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Arbeitsblatt (Druck) */
body.sheet { background: #fff; background-image: none; color: #111; font-size: 11pt; line-height: 1.4; }
.ws { max-width: 182mm; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: grid; gap: 10px; }
.ws-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid #1E3A6D; padding-bottom: 6px; }
.ws-head h1 { font-family: var(--f-display); font-weight: 800; font-size: 20pt; margin: 0; color: #1E3A6D; }
.ws-head .who { font-size: 10pt; text-align: right; line-height: 1.6; }
.ws-mission { display: grid; gap: 6px; padding-top: 6px; }
.ws-mission h2 { font-family: var(--f-display); font-weight: 800; font-size: 13.5pt; margin: 0; break-after: avoid; }
.ws-rule { font-size: 9.5pt; color: #333; margin: 0; padding: 5px 8px; background: #FFF7C7; border-radius: 6px; break-after: avoid; }
.ws-item { break-inside: avoid; display: grid; grid-template-columns: 2.4em 1fr; gap: 2px 6px; padding-block: 4px; border-bottom: 1px dotted #C8CFDA; }
.ws-no { font-weight: 800; color: #1E3A6D; }
.ws-item p { margin: 0; }
.ws-item .story { font-size: 8pt; color: #2B5FD9; }
.ws-ans { color: #444; }
.ws-blank { display: inline-block; min-width: 42mm; border-bottom: 1.2px solid #333; height: 1.1em; vertical-align: bottom; }
.ws-box { display: inline-block; width: 9mm; height: 7mm; border: 1.2px solid #333; border-radius: 2px; vertical-align: middle; }
.ws-box.sup { width: 6mm; height: 5mm; vertical-align: super; }
.ws-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(70mm, 1fr)); gap: 2px 12px; }
.ws-opts span::before { content: "○ "; font-family: system-ui, sans-serif; }
.ws-cmp { font-weight: 800; font-size: 12pt; }
.ws-circle { display: inline-block; width: 7mm; height: 7mm; border: 1.2px solid #333; border-radius: 50%; vertical-align: middle; margin-inline: 4px; }
.ws-cards { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.ws-cards span { border: 1px solid #999; border-radius: 4px; padding: 1px 6px; }
.ws-line svg { width: 100%; max-width: 150mm; height: auto; }
body.sheet .nl-axis, body.sheet .nl-tick { stroke: #111; }
body.sheet .nl-tick.minor { stroke: #555; }
body.sheet .nl-head { fill: #111; }
body.sheet .nl-label { fill: #111; }
body.sheet .nl-mark { stroke: #2B5FD9; }
body.sheet .nl-tip, body.sheet .nl-letter { fill: #2B5FD9; }
.ws-sol { break-before: page; display: grid; gap: 6px; }
.ws-sol h2 { font-family: var(--f-display); font-size: 16pt; margin: 0 0 4px; color: #1E3A6D; }
.ws-sol h3 { font-size: 11pt; margin: 6px 0 0; }
.ws-sol ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px; }
.ws-sol li { display: grid; grid-template-columns: 2.4em 1fr; gap: 6px; font-size: 9.5pt; break-inside: avoid; }
.ws-sol li b { font-size: 10pt; }
.ws-sol .ex { color: #444; }
@page { size: A4; margin: 13mm 12mm 14mm; }
</style>
</head>
<body>
<header class="cover" id="cover">
  <div class="cover-in">
    <div class="label">
      <div class="label-row"><label class="name-lab" for="nameIn">Name: <input id="nameIn" class="name-in" type="text" maxlength="24" autocomplete="off" spellcheck="false" placeholder="dein Name"></label><span>Fach: <b>Mathematik</b></span><span>Klasse: <b>5</b></span></div>
      <h1 class="title">Mission Riesenzahlen</h1>
      <div class="xp">
        <div class="rank"><small>Dein Rang</small><span id="rankName">Einer-Entdecker</span></div>
        <div class="xp-num"><span id="xpNum">0</span> XP</div>
        <div class="ruler" aria-hidden="true"><div class="fill" id="xpFill"></div></div>
        <div class="next-rank" id="nextRank"></div>
      </div>
    </div>

</header>
<div id="topbar"></div>
<main class="wrap" id="app"></main>

    <small>Passend zum LehrplanPLUS Gymnasium Bayern, Mathematik 5: große Zahlen, Zehnerpotenzen, Stellenwerte, Zahlenstrahl, Runden, ganze Zahlen. Der Fortschritt wird nur auf diesem Gerät gespeichert.</small>
  </div>
</footer>
<script>
"use strict";
/* ---------- kleine Helfer ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MINUS = "−";

function groups(n) {
  let s = String(Math.abs(n));
  const parts = [];
  while (s.length > 3) { parts.unshift(s.slice(-3)); s = s.slice(0, -3); }
  parts.unshift(s);
  return parts;
}
/* Zahl als HTML in Dreiergruppen (4-stellige Zahlen ohne Lücke, wie im Schulbuch üblich bleibt die Lücke trotzdem lesbar) */
function G(n) {
  const p = groups(n);
  return `<span class="n">${n < 0 ? MINUS : ""}${p[0]}${p.slice(1).map(x => `<span class="g">${x}</span>`).join("")}</span>`;
}
/* Zahl als Text mit schmalem Leerzeichen (für SVG, aria) */
function GT(n) { return (n < 0 ? MINUS : "") + groups(n).join(" "); }

/* Zahlwörter (bis unter 10^12) */
const ONES = ["", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf",
  "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
const TENS = ["", "", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];
function w100(n) {
  if (n < 20) return ONES[n];
  const t = Math.floor(n / 10), u = n % 10;
  return (u ? (u === 1 ? "ein" : ONES[u]) + "und" : "") + TENS[t];
}
function w1000(n) {
  const h = Math.floor(n / 100), r = n % 100;
  return (h ? (h === 1 ? "ein" : ONES[h]) + "hundert" : "") + (r ? w100(r) : "");
}
function words(n) {
  if (n === 0) return "null";
  const mrd = Math.floor(n / 1e9) % 1000, mio = Math.floor(n / 1e6) % 1000, tsd = Math.floor(n / 1e3) % 1000, rest = n % 1000;
  const out = [];
  if (mrd) out.push(mrd === 1 ? "eine Milliarde" : w1000(mrd) + " Milliarden");
  if (mio) out.push(mio === 1 ? "eine Million" : w1000(mio) + " Millionen");
  let small = "";
  if (tsd) small += w1000(tsd).replace(/eins$/, "ein") + "tausend";
  if (rest) small += w1000(rest);
  if (small) out.push(small);
  return out.join(" ");
}

/* Eingabe lesen: Leerzeichen, Punkte, Apostrophe erlaubt; Minus in allen Schreibweisen */
function parseNum(raw) {
  let s = String(raw).trim().replace(/[\s   .'’_]/g, "").replace(/[−–—]/g, "-");
  if (!/^-?\d+$/.test(s)) return NaN;
  return Number(s);
}

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function genPow() {
  const v = rnd(0, 4);
  if (v === 0) {
    const n = rnd(2, 12);
    return { type: "num", q: `${P(n)} = ?`, answer: 10 ** n, hint: `Eine 1 mit ${n} Nullen.`, explain: `${P(n)} = ${G(10 ** n)}.` };
  }
  if (v === 1) {
    const n = rnd(3, 12);
    return { type: "fill", q: "Schreib als Zehnerpotenz.", tpl: `${G(10 ** n)} = 10^{0}`, answers: [n],
      hint: "Zähl die Nullen. In Dreiergruppen geht es schneller.", explain: `${n} Nullen: ${G(10 ** n)} = ${P(n)}.` };
  }
  if (v === 2) {
    let a; do { a = rnd(0, 1) ? rnd(2, 9) : rnd(11, 99); } while (a % 10 === 0);
    const n = rnd(2, 8);
    return { type: "num", q: `${a} · ${P(n)} = ?`, answer: a * 10 ** n,
      hint: `${P(n)} = ${G(10 ** n)}. Häng an die ${a} also ${n} Nullen an.`, explain: `${a} · ${G(10 ** n)} = ${G(a * 10 ** n)}.` };
  }
  if (v === 3) {
    const map = [[3, "tausend"], [6, "eine Million"], [9, "eine Milliarde"], [12, "eine Billion"]];
    const [n, name] = pick(map);
    const opts = shuffle(map.map(x => x[1]));
    return { type: "choice", q: `Wie heißt ${P(n)}?`, options: opts, correct: opts.indexOf(name),
      hint: "Tausend: 3 Nullen. Million: 6. Milliarde: 9. Billion: 12.", explain: `${P(n)} = ${G(10 ** n)} = ${name}.` };
  }
  const k = rnd(2, 3);
  const pos = shuffle([1, 2, 3, 4, 5, 6, 7, 8]).slice(0, k).sort((x, y) => y - x);
  const dig = pos.map(() => rnd(1, 9));
  const N = pos.reduce((s, p, i) => s + dig[i] * 10 ** p, 0);
  return { type: "fill", q: "Zerlege in Zehnerpotenzen.", tpl: `${G(N)} = ` + pos.map((p, i) => `${dig[i]} · 10^{${i}}`).join(" + "), answers: pos,
    hint: `Bestimme für jede Ziffer ihren Platz. Die ${dig[0]} vorne steht bei den ${PLACE_DAT[pos[0]]}.`,
    explain: `${G(N)} = ` + pos.map((p, i) => G(dig[i] * 10 ** p)).join(" + ") + " = " + pos.map((p, i) => `${dig[i]} · ${P(p)}`).join(" + ") + "." };
}

function okWords(x) {
  const mrd = Math.floor(x / 1e9) % 1000, mio = Math.floor(x / 1e6) % 1000;
  return !((mrd % 100 === 1 && mrd !== 1) || (mio % 100 === 1 && mio !== 1));
}
function wordNum() {
  for (;;) {
    const z = () => (Math.random() < .35 ? 0 : pick([rnd(1, 999), rnd(1, 9) * 100, rnd(1, 99) * 10, rnd(1, 99)]));
    const big = rnd(0, 2);
    const mrd = big === 2 ? rnd(1, 99) : 0, mio = big >= 1 ? (Math.random() < .2 && big === 2 ? 0 : rnd(1, 999)) : rnd(1, 99);
    const tsd = z(), rest = z();
    if ((mrd % 100 === 1 && mrd !== 1) || (mio % 100 === 1 && mio !== 1)) continue;
    const N = mrd * 1e9 + mio * 1e6 + tsd * 1e3 + rest;
    if (N >= 1e6) return N;
  }
}

function genPlace() {
  const v = rnd(0, 2);
  if (v === 0) {
    let N, k, d, s;
    do {
      N = rnd(1000000, 999999999); s = String(N); k = rnd(1, s.length - 1); d = Number(s[s.length - 1 - k]);
    } while (d === 0 || s.split("").filter(c => Number(c) === d).length !== 1);
    const ks = new Set([k]);
    while (ks.size < 4) ks.add(rnd(0, s.length - 1));
    const vals = shuffle([...ks]).map(kk => d * 10 ** kk);
    return { type: "choice", q: `Welchen Wert hat die Ziffer ${d} in ${G(N)}?`, options: vals.map(G), correct: vals.indexOf(d * 10 ** k),
      hint: "Gliedere von rechts in Dreiergruppen und bestimme den Platz der Ziffer.",
      explain: `Die ${d} steht bei den ${PLACE_DAT[k]}. Ihr Wert ist ${G(d * 10 ** k)}.` };
  }
  const N = wordNum();
  if (v === 1) {
    return { type: "num", q: `Schreib in Ziffern: <span class="hl">${words(N)}</span>`, answer: N,
      hint: "Schreib zuerst die Milliarden oder Millionen, dann die Dreiergruppen dahinter. Leere Plätze werden Nullen.",
      explain: `${words(N)} = ${G(N)}.` };
  }
  const cand = shuffle([N * 10, N * 1000, N % 10 === 0 ? N / 10 : null, N % 1000 === 0 ? N / 1000 : null, N + 10 ** (String(N).length - 2), N * 100]
    .filter(x => x && x !== N && x < 1e12 && Number.isInteger(x) && okWords(x)));
  const opts = shuffle([N, ...cand.slice(0, 3)]);
  return { type: "choice", q: `Welches Zahlwort passt zu ${G(N)}?`, options: opts.map(words), correct: opts.indexOf(N),
    hint: "Zähl die Dreiergruppen von rechts: Tausender, Millionen, Milliarden.", explain: `${G(N)} = ${words(N)}.` };
}

function cmpPack(av, bv, a, b, hint, note) {
  if (Math.random() < .5) { [av, bv] = [bv, av]; [a, b] = [b, a]; }
  const sym = av < bv ? "<" : av > bv ? ">" : "=";
  const symH = sym === "<" ? "&lt;" : sym === ">" ? "&gt;" : "=";
  return { type: "compare", a: { v: a }, b: { v: b }, correct: sym, _a: av, _b: bv, hint, explain: `${G(av)} ${symH} ${G(bv)}.${note ? " " + note : ""}` };
}
function genCmp() {
  const v = rnd(0, 3);
  if (v === 0) {
    const len = rnd(6, 10), s = String(rnd(10 ** (len - 1), 10 ** len - 1)), i = rnd(1, len - 1);
    let d2; do { d2 = rnd(0, 9); } while (d2 === Number(s[i]));
    const t = s.slice(0, i) + d2 + s.slice(i + 1);
    return cmpPack(Number(s), Number(t), G(Number(s)), G(Number(t)), "Gleich viele Stellen: Geh von links, bis sich zwei Ziffern unterscheiden.");
  }
  if (v === 1) {
    const k = rnd(4, 10), av = 10 ** k - rnd(1, 99), bv = 10 ** k + (rnd(0, 1) ? 0 : rnd(1, 99));
    return cmpPack(av, bv, G(av), G(bv), "Zähl die Stellen.");
  }
  if (v === 2) {
    const n = rnd(3, 9), c = rnd(2, 9), av = c * 10 ** n, w = rnd(0, 2);
    const bv = w === 0 ? av : w === 1 ? c * 10 ** (n + 1) : c * 10 ** (n - 1);
    return cmpPack(av, bv, `${c} · ${P(n)}`, G(bv), `Schreib ${c} · ${P(n)} aus: eine ${c} mit ${n} Nullen.`);
  }
  const n = pick([6, 9]), c = rnd(2, 90), av = c * 10 ** n;
  const bv = pick([av, av * 10, av / 10, av + 10 ** (n - 1)]);
  return cmpPack(av, bv, `${c} ${n === 6 ? "Millionen" : "Milliarden"}`, G(bv), n === 6 ? "Eine Million hat 6 Nullen." : "Eine Milliarde hat 9 Nullen.");
}

function genOrder() {
  const vals = new Set();
  if (rnd(0, 1)) {
    const len = rnd(6, 9), base = String(rnd(10 ** (len - 1), 10 ** len - 1));
    while (vals.size < 5) {
      const i = rnd(1, len - 1), d = rnd(0, 9);
      vals.add(Number(base.slice(0, i) + d + base.slice(i + 1)));
    }
  } else {
    const core = rnd(11, 99) * 10 + rnd(1, 9);
    const exps = shuffle([0, 1, 2, 3, 4, 5]).slice(0, 5);
    exps.forEach(e => vals.add(core * 10 ** e + (Math.random() < .4 ? rnd(1, 9) : 0)));
  }
  return { type: "order", q: "Ordne von klein nach groß.", items: shuffle([...vals]).map(v => ({ label: G(v), v })),
    hint: "Erst die Stellen zählen, dann von links Ziffer für Ziffer vergleichen." };
}

function genLine() {
  const s = pick([1000, 5000, 10000, 50000, 100000, 500000, 1000000, 10000000]);
  const min = rnd(0, 4) * s * 10, max = min + 10 * s;
  const cfg = { min, max, minor: s, labels: [min, min + 5 * s, max] };
  if (s >= 1000000) cfg.fmt = "mio";
  const ticks = shuffle([1, 2, 3, 4, 6, 7, 8, 9]);
  const hint = `Zwischen ${G(min)} und ${G(min + 5 * s)} liegen 5 Abschnitte. Ein Teilstrich ist also ${G(s)} wert.`;
  if (rnd(0, 1)) {
    const t = ticks[0], v = min + t * s, L = pick(["A", "B", "P", "X"]);
    return { type: "line", q: `Welche Zahl zeigt der Pfeil ${L}?`, cfg, marks: [{ t: L, v }], ask: "value", target: L, hint,
      explain: `${L} steht ${t} Teilstriche nach ${G(min)}: ${G(min)} + ${t} · ${G(s)} = ${G(v)}.` };
  }
  const pts = ticks.slice(0, 4).sort((x, y) => x - y);
  const marks = pts.map((t, i) => ({ t: "ABCD"[i], v: min + t * s }));
  const m = pick(marks);
  return { type: "line", q: `Welcher Pfeil zeigt auf ${G(m.v)}?`, cfg, marks, ask: "which", target: m.v, hint,
    explain: `${G(m.v)} = ${G(min)} + ${(m.v - min) / s} · ${G(s)}. Dort steht ${m.t}.` };
}

function genRound() {
  const len = rnd(5, 9), N = rnd(10 ** (len - 1), 10 ** len - 1), k = rnd(1, Math.min(6, len - 1));
  const p = 10 ** k, d = Math.floor(N / (p / 10)) % 10, base = Math.floor(N / p) * p, ans = d >= 5 ? base + p : base;

}

function genNeg() {

/* ---------- Zahlenstrahl als SVG ---------- */
function lineSVG(cfg, marks) {
  const W = 640, H = 128, L = 64, R = 576, Y = 80;
  const x = v => +(L + (v - cfg.min) / (cfg.max - cfg.min) * (R - L)).toFixed(1);
  const fmt = v => cfg.fmt === "mio" ? (v === 0 ? "0" : `${GT(v / 1e6)} Mio.`) : GT(v);
  let s = `<svg class="nl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zahlenstrahl von ${fmt(cfg.min)} bis ${fmt(cfg.max)}">`;
  s += `<line class="nl-axis" x1="${L - 22}" y1="${Y}" x2="${R + 26}" y2="${Y}" stroke-width="2.5"/>`;
  s += `<polygon class="nl-head" points="${R + 38},${Y} ${R + 24},${Y - 7} ${R + 24},${Y + 7}"/>`;
  const n = Math.round((cfg.max - cfg.min) / cfg.minor);
  for (let i = 0; i <= n; i++) {
    const v = cfg.min + i * cfg.minor, lab = cfg.labels.includes(v), px = x(v);
    s += `<line class="nl-tick${lab ? "" : " minor"}" x1="${px}" y1="${Y - (lab ? 12 : 8)}" x2="${px}" y2="${Y + (lab ? 12 : 8)}" stroke-width="${lab ? 2.8 : 1.8}"/>`;
    if (lab) s += `<text class="nl-label" x="${px}" y="${Y + 40}" text-anchor="middle">${fmt(v)}</text>`;
  }
  marks.forEach(m => {
    const px = x(m.v);
    s += `<line class="nl-mark" x1="${px}" y1="34" x2="${px}" y2="${Y - 19}"/>`;
    s += `<polygon class="nl-tip" points="${px},${Y - 9} ${px - 7},${Y - 22} ${px + 7},${Y - 22}"/>`;
    s += `<text class="nl-letter" x="${px}" y="28" text-anchor="middle">${m.t}</text>`;
  });
  return s + "</svg>";
}

const SYM = { "<": "&lt;", ">": "&gt;", "=": "=" };
const sortedItems = it => it.items.slice().sort((a, b) => a.v - b.v);
const markOf = it => it.marks.find(m => m.t === it.target);
function fillTpl(tpl, fn) {
  return tpl.replace(/\^\{(\d+)\}/g, (_, k) => fn(+k, true)).replace(/\{(\d+)\}/g, (_, k) => fn(+k, false));
}
function solHTML(it) {
  switch (it.type) {
    case "num": return G(it.answer) + (it.unit ? " " + it.unit : "");
    case "fill": return fillTpl(it.tpl, (k, sup) => sup ? `<sup>${it.answers[k]}</sup>` : String(it.answers[k]));
    case "choice": return it.options[it.correct];
    case "compare": return `${it.a.v} ${SYM[it.correct]} ${it.b.v}`;
    case "order": return sortedItems(it).map(x => x.label).join(" &lt; ");
    case "line": return it.ask === "value" ? `${it.target} = ${G(markOf(it).v)}` : `Pfeil ${it.marks.find(m => m.v === it.target).t}`;
  }
  return "";
}

let actx = null;
function tone(freqs, dur = .12, type = "sine", vol = .07) {
  if (!store.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime + .01;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .03); t += dur * .75;
    });
  } catch (e) { /* ohne Ton weiter */ }
}

function renderTask(it, host, ctx) {
  const st = { it, tries: 0, done: false, order: [], sign: false };
  const card = document.createElement("article");
  card.className = "task";
  const q = it.q || "Welches Zeichen passt: &lt;, = oder &gt;?";
  card.innerHTML = `${it.story ? `<p class="story">${it.story}</p>` : ""}<p class="q" id="qtext">${q}</p>` +
    `<div class="papa"><b>Lösung:</b> ${solHTML(it)}</div><div class="area"></div><p class="hint" hidden></p>` +
    `<div class="fb" role="status" aria-live="polite" hidden></div>` +
    `<div class="actions"><button class="btn btn-ghost" type="button" data-act="hint">Tipp</button><button class="btn btn-primary" type="button" data-act="check">Prüfen</button></div>`;
  host.appendChild(card);
  const area = card.querySelector(".area"), fb = card.querySelector(".fb"), hintEl = card.querySelector(".hint");
  const btnHint = card.querySelector('[data-act="hint"]'), btnMain = card.querySelector('[data-act="check"]');
  const instant = it.type === "choice" || it.type === "compare" || (it.type === "line" && it.ask === "which");
  if (instant) btnMain.hidden = true;

  /* Eingabebereich aufbauen */
  let input = null;
  if (it.type === "num") area.innerHTML = numInput(it);
  if (it.type === "line") area.innerHTML = `<div class="nl-wrap">${lineSVG(it.cfg, it.marks)}</div>` + (it.ask === "value" ? numInput(it, `${it.target} =`) : "");
  if (it.type === "fill") {
    area.innerHTML = `<div class="tpl">${fillTpl(it.tpl, (k, sup) => `<input class="slot${sup ? " sup" : ""}" data-k="${k}" type="text" inputmode="numeric" autocomplete="off" aria-label="${sup ? "Hochzahl" : "Lücke"} ${k + 1}">`)}</div>`;
  }
  let optBtns = [];
  if (it.type === "choice" || (it.type === "line" && it.ask === "which")) {
    const opts = it.type === "choice" ? it.options : it.marks.map(m => m.t);
    const letters = it.type === "line";
    area.insertAdjacentHTML("beforeend", `<div class="opts${letters ? " letters" : ""}">${opts.map((o, i) =>
      `<button class="opt" type="button" data-i="${i}">${letters ? "" : `<span class="key">${"ABCDEF"[i]}</span>`}<span>${o}</span></button>`).join("")}</div>`);
    optBtns = [...area.querySelectorAll(".opt")];
    optBtns.forEach(b => b.addEventListener("click", () => {
      if (st.done || b.disabled) return;
      optBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      const i = +b.dataset.i;
      judge(it.type === "choice" ? i === it.correct : it.marks[i].v === it.target, () => { b.classList.add("no"); b.disabled = true; });
    }));
  }
  let opBtns = [];
  if (it.type === "compare") {
    const cap = s => s.cap ? `<small>${s.cap}</small>` : "";
    area.innerHTML = `<div class="cmp"><div class="side">${it.a.v}${cap(it.a)}</div><div class="hole" aria-hidden="true">?</div><div class="side">${it.b.v}${cap(it.b)}</div></div>` +
      `<div class="ops"><button class="op" type="button" data-op="<" aria-label="kleiner als">&lt;</button><button class="op" type="button" data-op="=" aria-label="gleich">=</button><button class="op" type="button" data-op=">" aria-label="größer als">&gt;</button></div>`;
    const hole = area.querySelector(".hole");
    opBtns = [...area.querySelectorAll(".op")];
    opBtns.forEach(b => b.addEventListener("click", () => {
      if (st.done || b.disabled) return;
      opBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      hole.innerHTML = SYM[b.dataset.op]; hole.classList.add("set");
      judge(b.dataset.op === it.correct, () => { b.classList.add("no"); b.disabled = true; hole.textContent = "?"; hole.classList.remove("set"); });
    }));
  }
  let pool = [];
  if (it.type === "order") {
    do { pool = shuffle(it.items); } while (pool.every((x, i) => i === 0 || pool[i - 1].v < x.v));
    area.innerHTML = `<div class="pool" aria-label="Karten">${pool.map((x, i) => `<button class="card-n" type="button" data-i="${i}">${x.label}</button>`).join("")}</div>` +
      `<p class="lt">kleinste zuerst</p><div class="order-row">${pool.map(() => `<div class="slotline"><button type="button" aria-label="leerer Platz"></button></div>`).join("")}</div>`;
    const cards = [...area.querySelectorAll(".card-n")], lines = [...area.querySelectorAll(".slotline")];
    const sync = () => {
      lines.forEach((ln, k) => {
        const i = st.order[k], b = ln.querySelector("button");
        ln.classList.toggle("filled", i !== undefined);
        b.innerHTML = i !== undefined ? pool[i].label : "";
        b.setAttribute("aria-label", i !== undefined ? "Karte zurücklegen" : "leerer Platz");
      });
      cards.forEach((c, i) => { c.disabled = st.order.includes(i); });
      btnMain.disabled = st.order.length !== pool.length;
    };
    cards.forEach(c => c.addEventListener("click", () => { if (st.done) return; st.order.push(+c.dataset.i); sync(); }));
    lines.forEach((ln, k) => ln.querySelector("button").addEventListener("click", () => {
      if (st.done || st.order[k] === undefined) return; st.order.splice(k, 1); sync();
    }));
    st.sync = sync; sync();
  }
  input = area.querySelector("#ans");
  const slots = [...area.querySelectorAll(".slot")];
  const signBtn = area.querySelector(".sign");
  const readNum = () => {
    let v = parseNum(input.value);
    if (!isNaN(v) && st.sign) v = -Math.abs(v);
    return v;
  };
  if (signBtn) signBtn.addEventListener("click", () => { st.sign = !st.sign; signBtn.setAttribute("aria-pressed", String(st.sign)); echo(); input.focus(); });
  const echoEl = area.querySelector(".echo");
  function echo() {
    if (!echoEl) return;
    const raw = input.value.trim();
    if (!raw) { echoEl.innerHTML = ""; return; }
    const v = readNum();
    echoEl.innerHTML = isNaN(v) ? "Bitte nur Ziffern eingeben. Leerzeichen sind erlaubt." : `Du hast geschrieben: <b>${G(v)}</b>`;
  }
  if (input) {
    input.addEventListener("input", echo);
    input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); btnMain.click(); } });
  }
  slots.forEach((s, k) => s.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); if (k < slots.length - 1) slots[k + 1].focus(); else btnMain.click(); }
  }));

  btnHint.addEventListener("click", () => { hintEl.innerHTML = `<b>Tipp:</b> ${it.hint}`; hintEl.hidden = false; btnHint.disabled = true; });
  btnMain.addEventListener("click", () => {
    if (st.done) { ctx.onNext(); return; }
    if (it.type === "num" || (it.type === "line" && it.ask === "value")) {
      const v = readNum();
      if (isNaN(v)) { echo(); if (!input.value.trim()) echoEl.innerHTML = "Schreib zuerst deine Antwort in das Feld."; input.focus(); return; }
      judge(v === (it.type === "num" ? it.answer : markOf(it).v), () => input.select());
    } else if (it.type === "fill") {
      const vals = slots.map(s => parseNum(s.value));
      if (vals.some(isNaN)) { showFb("almost", "Füll zuerst alle Kästchen aus.", ""); return; }
      judge(vals.every((v, k) => v === it.answers[k]), () => slots.forEach((s, k) => { if (parseNum(s.value) !== it.answers[k]) s.select(); }));
    } else if (it.type === "order") {
      const right = sortedItems(it);
      const okUpTo = st.order.findIndex((i, k) => pool[i].v !== right[k].v);
      judge(okUpTo === -1, null, okUpTo > 0 ? `Die ersten ${okUpTo} Karten stimmen schon.` : "");
    }
  });

  function showFb(kind, head, body) {
    fb.className = "fb " + kind; fb.hidden = false;
    fb.innerHTML = `<div class="fb-h">${head}</div>${body ? `<p>${body}</p>` : ""}`;
  }
  function judge(ok, onWrong, extra) {
    st.tries++;
    if (ok) return finish(st.tries === 1 ? "star" : "done");
    if (st.tries === 1) {
      sfx.almost();
      showFb("almost", pick(ALMOST), [extra, it.hint].filter(Boolean).join(" "));
      hintEl.hidden = true; btnHint.disabled = true;
      if (onWrong) onWrong();
      return;
    }
    finish("shown");
  }
  function finish(status) {
    st.done = true;
    const gain = ctx.onSolved(status);
    const plus = gain ? ` <span class="plus">+${gain} XP</span>` : "";
    const expl = it.explain || "";
    if (status === "shown") {
      showFb("reveal", pick(REVEAL), "");
      fb.insertAdjacentHTML("beforeend", `<p class="sol">Lösung: ${solHTML(it)}</p>${expl ? `<p>${expl}</p>` : ""}`);
    } else {
      sfx.good();
      showFb("good", (status === "star" ? pick(GOOD1) : pick(GOOD2)) + plus, "");
      const extraSol = it.type === "order" ? `<p class="sol">${solHTML(it)}</p>` : "";
      fb.insertAdjacentHTML("beforeend", extraSol + (expl ? `<p>${expl}</p>` : ""));
    }
    /* richtigen Zustand zeigen */
    if (it.type === "choice") optBtns[it.correct].classList.add("ok");
    if (it.type === "line" && it.ask === "which") optBtns[it.marks.findIndex(m => m.v === it.target)].classList.add("ok");
    if (it.type === "compare") {
      const hole = area.querySelector(".hole"); hole.innerHTML = SYM[it.correct]; hole.classList.add("set");
      opBtns.forEach(b => { if (b.dataset.op === it.correct) { b.classList.remove("no"); b.classList.add("ok"); } });
    }
    if (it.type === "order" && status === "shown") { st.order = sortedItems(it).map(x => pool.indexOf(x)); st.sync(); }
    if (input && status === "shown") { input.value = it.type === "num" ? GT(it.answer) : GT(markOf(it).v); st.sign = false; echo(); }
    if (it.type === "fill" && status === "shown") slots.forEach((s, k) => { s.value = it.answers[k]; });
    area.querySelectorAll("input, .opt, .op, .card-n, .sign, .slotline button").forEach(el => { el.disabled = true; });
    btnHint.hidden = true; hintEl.hidden = true;
    btnMain.hidden = false; btnMain.disabled = false; btnMain.textContent = "Weiter";
    btnMain.focus({ preventScroll: true });
    fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  if (!coarse()) { const first = input || slots[0]; if (first) first.focus({ preventScroll: true }); }
  return st;
}

/* ---------- Arbeitsblatt zum Ausdrucken (#arbeitsblatt) ---------- */
function wsItem(it) {
  const story = it.story ? `<p class="story">${it.story}</p>` : "";
  const cap = s => (s.cap ? ` <small>(${s.cap})</small>` : "");
  switch (it.type) {
    case "num":
      return `${story}<p>${it.q}</p><p class="ws-ans">Antwort: <span class="ws-blank"></span>${it.unit ? " " + it.unit : ""}</p>`;
    case "fill":
      return `${story}<p>${it.q}</p><p class="ws-cmp">${fillTpl(it.tpl, (k, sup) => `<span class="ws-box${sup ? " sup" : ""}"></span>`)}</p>`;
    case "choice":
      return `${story}<p>${it.q}</p><div class="ws-opts">${it.options.map(o => `<span>${o}</span>`).join("")}</div>`;
    case "compare":
      return `${story}<p>Setze &lt;, = oder &gt; ein.</p><p class="ws-cmp">${it.a.v}${cap(it.a)}<span class="ws-circle"></span>${it.b.v}${cap(it.b)}</p>`;
    case "order":
      return `${story}<p>${it.q} Nummeriere die Karten: 1 für die kleinste Zahl.</p><div class="ws-cards">${it.items.map(x => `<span><span class="ws-box" style="width:6mm;height:5mm"></span> ${x.label}</span>`).join("")}</div>`;
    case "line":
      return `${story}<p>${it.q}</p><div class="ws-line">${lineSVG(it.cfg, it.marks)}</div>` +
        (it.ask === "value" ? `<p class="ws-ans">${it.target} = <span class="ws-blank"></span></p>` : `<p class="ws-ans">Pfeil: <span class="ws-box"></span></p>`);
  }
  return "";
}
function renderSheet() {
  document.documentElement.setAttribute("data-theme", "light");
  document.body.classList.add("sheet");
  document.body.classList.remove("papa-on");
  $("#cover").hidden = true; $("#foot").hidden = true; $("#topbar").innerHTML = "";
  const a = $("#app");
  a.className = "ws";
  let h = `<div class="ws-head"><h1>Mission Riesenzahlen</h1><div class="who">Name: ________________<br>Datum: ________________</div></div>`;
  MISSIONS.forEach((m, mi) => {
    h += `<section class="ws-mission"><h2>${mi + 1}. ${m.title}${m.bonus ? " (Bonus)" : ""}</h2><p class="ws-rule">${m.intro}${m.note ? " " + m.note : ""}</p>`;
    m.items.forEach((it, ii) => { h += `<div class="ws-item"><span class="ws-no">${mi + 1}.${ii + 1}</span><div>${wsItem(it)}</div></div>`; });
    h += "</section>";
  });
  h += `<section class="ws-sol"><h2>Lösungen</h2>`;
  MISSIONS.forEach((m, mi) => {
    h += `<h3>${mi + 1}. ${m.title}</h3><ol>` + m.items.map((it, ii) =>
      `<li><span>${mi + 1}.${ii + 1}</span><span><b>${solHTML(it)}</b>${it.explain ? ` <span class="ex">· ${it.explain}</span>` : ""}</span></li>`).join("") + "</ol>";
  });
  a.innerHTML = h + "</section>";
}

/* ---------- Speicher ---------- */
const KEY = "mission-riesenzahlen-v1";
const store = { xp: 0, prog: {}, best: 0, papa: false, sound: true };
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && typeof s === "object") Object.assign(store, s); } catch (e) { /* ohne Speicher */ }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ohne Speicher */ } }

const VAL = { star: 10, done: 5, shown: 0 };
const rv = s => (s ? VAL[s] : -1);
let view = { name: "home" };
let stairSel = 6;
const app = () => $("#app");

/* ---------- Kopf ---------- */
function rankOf(xp) { let i = 0; RANKS.forEach((r, k) => { if (xp >= r.xp) i = k; }); return { i, r: RANKS[i], next: RANKS[i + 1] }; }
function renderHeader() {
  const { r, next } = rankOf(store.xp);
  $("#xpNum").textContent = store.xp;
  $("#rankName").textContent = r.name;
  $("#xpFill").style.width = Math.round((next ? (store.xp - r.xp) / (next.xp - r.xp) : 1) * 100) + "%";
  $("#nextRank").textContent = next ? `Noch ${next.xp - store.xp} XP bis zum Rang „${next.name}“` : "Höchster Rang erreicht!";
}
function showCover(on) { $("#cover").hidden = !on; }
function topbar(title, count, frac) {
  const tb = $("#topbar");
  if (!title) { tb.className = ""; tb.innerHTML = ""; return; }
  tb.className = "topbar";
  tb.innerHTML = `<div class="topbar-in"><button class="back" type="button" id="backBtn">← Übersicht</button><div class="tb-title">${title}</div>` +
    `<div class="tb-count">${count}</div><div class="pbar" aria-hidden="true"><i style="width:${Math.round(frac * 100)}%"></i></div></div>`;
  $("#backBtn").addEventListener("click", renderHome);
}
const top0 = () => { try { window.scrollTo({ top: 0 }); } catch (e) { window.scrollTo(0, 0); } };

/* ---------- Übersicht ---------- */
const isDone = m => m.items.every((_, i) => (store.prog[m.id] || [])[i]);
const firstOpen = m => { const i = m.items.findIndex((_, k) => !(store.prog[m.id] || [])[k]); return i < 0 ? 0 : i; };
function tileHTML(m, isNext) {
  const pr = store.prog[m.id] || [];
  const stars = pr.filter(s => s === "star").length;
  return `<button class="mtile${isDone(m) ? " done" : ""}" type="button" data-m="${m.id}"><span class="mbadge"><span>${m.badge}</span></span>` +
    `<span class="mtitle">${m.title}${isNext ? '<span class="chip-next">Als Nächstes</span>' : ""}</span>` +
    `<span class="mshort">${m.short}${m.note ? `<br>${m.note}` : ""}</span>` +
    `<span class="dots" aria-label="${stars} von ${m.items.length} auf Anhieb gelöst">${m.items.map((_, i) => `<span class="dot ${pr[i] || ""}"></span>`).join("")}</span></button>`;
}
function stairsInfo(n) {
  const name = POW_NAME[n];
  return `<div class="step-big">${P(n)} = ${G(10 ** n)}</div><div class="step-meta">${name[0].toUpperCase() + name.slice(1)} · ${n} ${n === 1 ? "Null" : "Nullen"}</div><p class="step-ex">${STAIRS[n]}</p>`;
}
function renderHome() {
  view = { name: "home" };
  showCover(true); topbar("");
  const main = MISSIONS.filter(m => !m.bonus), bonus = MISSIONS.filter(m => m.bonus);
  const next = main.find(m => !isDone(m)) || bonus.find(m => !isDone(m));
  app().innerHTML =
    `<section class="sec"><h2 class="sec-h">Deine <span class="hl">Missionen</span></h2>` +
    `<p class="sec-p">Sitzt eine Aufgabe beim ersten Versuch, gibt es 10 XP, im zweiten Versuch 5 XP. Ein grüner Punkt heißt: auf Anhieb gelöst.</p>` +
    `<div class="missions">${main.map(m => tileHTML(m, next && m.id === next.id)).join("")}</div></section>` +
    `<section class="sec"><h2 class="sec-h">Bonus und Training</h2><div class="missions">${bonus.map(m => tileHTML(m, next && m.id === next.id)).join("")}` +
    `<button class="mtile train" type="button" data-train="1"><span class="mbadge">∞</span><span class="mtitle">Endlos-Training</span>` +
    `<span class="mshort">Immer neue Aufgaben in Runden zu 10, zu einem Thema oder alles gemischt. Gut zum Üben vor der Schulaufgabe.</span>` +
    `<span class="dots">${store.best ? `Rekord-Serie: ${store.best} auf Anhieb` : "Noch keine Runde gespielt"}</span></button></div></section>` +
    `<section class="sec"><h2 class="sec-h">Die Stufenzahlen-Treppe</h2><p class="sec-p">10, 100, 1 000 und so weiter heißen Stufenzahlen. Jede Stufe ist 10-mal so viel wie die davor. Tipp auf eine Stufe!</p>` +
    `<div class="stairs-box"><div class="stairs"><div class="stairs-in">${POW_NAME.map((_, n) => `<button class="step" type="button" style="--i:${n}" data-n="${n}" aria-pressed="${n === stairSel}" aria-label="10 hoch ${n}">10<sup>${n}</sup></button>`).join("")}</div></div>` +
    `<div class="step-info" aria-live="polite">${stairsInfo(stairSel)}</div></div></section>`;
  app().querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => startMission(b.dataset.m)));
  app().querySelector("[data-train]").addEventListener("click", () => startTrain("mix"));
  app().querySelectorAll(".step").forEach(b => b.addEventListener("click", () => {
    stairSel = +b.dataset.n;
    app().querySelectorAll(".step").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    app().querySelector(".step-info").innerHTML = stairsInfo(stairSel);
  }));
  top0();
}

/* ---------- Mission ---------- */
function startMission(id, idx) {
  const m = MISSIONS.find(x => x.id === id);
  if (!m) return renderHome();
  view = { name: "mission", m, idx: idx === undefined ? firstOpen(m) : Math.min(idx, m.items.length - 1), gained: 0, r0: rankOf(store.xp).i, t0: Date.now(), star: 0, cnt: 0 };
  renderMission();
}
function renderMission() {
  const { m, idx } = view;
  showCover(false);
  topbar(m.title, `${idx + 1} / ${m.items.length}`, idx / m.items.length);
  app().innerHTML = `<p class="intro">${m.intro}</p>`;
  renderTask(m.items[idx], app(), {
    onSolved: status => {
      const pr = store.prog[m.id] = store.prog[m.id] || [];
      view.cnt = (view.cnt || 0) + 1; if (status === "star") view.star = (view.star || 0) + 1;
      const gain = Math.max(0, VAL[status] - Math.max(0, rv(pr[idx])));
      if (rv(status) > rv(pr[idx])) pr[idx] = status;
      store.xp += gain; view.gained += gain; save(); renderHeader();
      return gain;
    },
    onNext: () => { if (view.idx + 1 < m.items.length) { view.idx++; renderMission(); } else renderDone(); }
  });
  top0();
}
function renderDone() {
  const { m } = view;
  try { if (window.Uebmal && view.cnt) Uebmal.melde({ modul: m.id, titel: m.title, richtig: view.star || 0, gesamt: view.cnt, dauer_s: Math.round((Date.now() - (view.t0 || Date.now())) / 1000) }); } catch (e) {}
  const pr = store.prog[m.id] || [], n = m.items.length, stars = pr.filter(s => s === "star").length;
  const r1 = rankOf(store.xp).i;
  const order = MISSIONS.indexOf(m);
  const next = MISSIONS.slice(order + 1).find(x => !isDone(x)) || MISSIONS.find(x => !isDone(x));
  view = { name: "done", m };
  showCover(false); topbar(m.title, "fertig", 1);
  app().innerHTML = `<div class="done-box"><div class="stamp"><span><b>${stars}/${n}</b>auf Anhieb</span></div>` +
    `<h2 class="done-h">${stars === n ? "Perfekte Mission!" : "Mission geschafft!"}</h2>` +
    `<p class="done-p">${stars === n ? "Jede Aufgabe saß beim ersten Versuch." : "Die fehlenden grünen Punkte holst du dir, wenn du die Mission nochmal spielst."}` +
    ` In dieser Runde: +${view.gained || 0} XP.</p>` +
    (r1 > (view.r0 ?? r1) ? `<div class="rankup">Neuer Rang: ${RANKS[r1].name}!</div>` : "") +
    `<div class="actions" style="justify-content:center">` +
    `<button class="btn btn-ghost" type="button" id="againBtn">Nochmal spielen</button>` +
    `<button class="btn btn-primary" type="button" id="nextBtn">${next ? `Weiter: ${next.title}` : "Zum Endlos-Training"}</button></div>` +
    `<button class="linkish" type="button" id="homeBtn">Zur Übersicht</button></div>`;
  $("#againBtn").addEventListener("click", () => startMission(m.id, 0));
  $("#nextBtn").addEventListener("click", () => (next ? startMission(next.id) : startTrain("mix")));
  $("#homeBtn").addEventListener("click", renderHome);
  sfx.win(); top0();
}

/* ---------- Endlos-Training ---------- */
function startTrain(topic) {
  view = { name: "train", topic: topic || "mix", n: 0, score: 0, streak: 0, it: null, gained: 0, r0: rankOf(store.xp).i, t0: Date.now() };
  nextTrain();
}
function nextTrain() {
  if (view.n >= 10) return renderTrainDone();
  view.it = genItem(view.topic); view.n++;
  renderTrain();
}
function renderTrain() {
  showCover(false);
  topbar("Endlos-Training", `${view.n} / 10`, (view.n - 1) / 10);
  app().innerHTML = `<div class="sec"><div class="topics" role="group" aria-label="Thema wählen">${TOPICS.map(t =>
    `<button class="topic" type="button" data-t="${t.id}" aria-pressed="${t.id === view.topic}">${t.name}</button>`).join("")}</div>` +
    `<div class="streak">Serie: ${view.streak} auf Anhieb · Rekord: ${store.best}</div></div>`;
  app().querySelectorAll(".topic").forEach(b => b.addEventListener("click", () => startTrain(b.dataset.t)));
  renderTask(view.it, app(), {
    onSolved: status => {
      const gain = status === "star" ? 5 : status === "done" ? 2 : 0;
      if (status === "star") { view.score++; view.streak++; } else view.streak = 0;
      store.best = Math.max(store.best || 0, view.streak);
      store.xp += gain; view.gained += gain; save(); renderHeader();
      const s = app().querySelector(".streak");
      if (s) s.textContent = `Serie: ${view.streak} auf Anhieb · Rekord: ${store.best}`;
      return gain;
    },
    onNext: nextTrain
  });
  top0();
}
function renderTrainDone() {
  const s = view.score, r1 = rankOf(store.xp).i;
  try { if (window.Uebmal) { const tp = TOPICS.find(t => t.id === view.topic); Uebmal.melde({ modul: "training-" + view.topic, titel: "Endlos-Training" + (tp ? ": " + tp.name : ""), richtig: s, gesamt: 10, dauer_s: Math.round((Date.now() - (view.t0 || Date.now())) / 1000) }); } } catch (e) {}
  const head = s === 10 ? "Endgegner besiegt!" : s >= 8 ? "Stark!" : s >= 6 ? "Gut dabei!" : "Weiter so!";
  view = { name: "trainDone", topic: view.topic, r0: view.r0, gained: view.gained };
  topbar("Endlos-Training", "Runde fertig", 1);
  app().innerHTML = `<div class="done-box"><div class="stamp"><span><b>${s}/10</b>auf Anhieb</span></div><h2 class="done-h">${head}</h2>` +
    `<p class="done-p">${s} von 10 Aufgaben saßen beim ersten Versuch. ${s < 6 ? "Jede Runde macht dich sicherer. Gleich noch eine?" : "Weiter so, das ist Schulaufgaben-Niveau."} In dieser Runde: +${view.gained} XP.</p>` +
    (r1 > view.r0 ? `<div class="rankup">Neuer Rang: ${RANKS[r1].name}!</div>` : "") +
    `<div class="actions" style="justify-content:center"><button class="btn btn-ghost" type="button" id="homeBtn">Zur Übersicht</button>` +
    `<button class="btn btn-primary" type="button" id="againBtn">Neue Runde</button></div></div>`;
  $("#againBtn").addEventListener("click", () => startTrain(view.topic));
  $("#homeBtn").addEventListener("click", renderHome);
  sfx.win(); top0();
}

/* ---------- Fußzeile ---------- */
function applyToggles() {
  document.body.classList.toggle("papa-on", !!store.papa);
  $("#papaSwitch").setAttribute("aria-checked", String(!!store.papa));
  $("#soundSwitch").setAttribute("aria-checked", String(!!store.sound));
}
function wireFooter() {
  $("#papaSwitch").addEventListener("click", () => { store.papa = !store.papa; save(); applyToggles(); });
  $("#soundSwitch").addEventListener("click", () => { store.sound = !store.sound; save(); applyToggles(); if (store.sound) sfx.good(); });
  const area = $("#resetArea");
  const idle = () => {
    area.innerHTML = '<button class="linkish" type="button" id="resetBtn">Fortschritt auf diesem Gerät löschen</button>';
    $("#resetBtn").addEventListener("click", ask);
  };
  const ask = () => {
    area.innerHTML = '<div class="confirm"><span>Alle XP und Punkte löschen?</span><button class="btn btn-ghost" type="button" id="resNo">Abbrechen</button><button class="btn btn-primary" type="button" id="resYes">Ja, löschen</button></div>';
    $("#resNo").addEventListener("click", idle);
    $("#resYes").addEventListener("click", () => {
      Object.assign(store, { xp: 0, prog: {}, best: 0 }); save(); renderHeader(); idle(); renderHome();
    });
  };
  idle();
}

/* ---------- Start ---------- */
function start(data) {
  try { document.documentElement.lang = "de"; } catch (e) { /* egal */ }
  load(); applyToggles(); renderHeader();
  const ni = $("#nameIn");
  if (ni) { ni.value = store.name || ""; ni.addEventListener("input", () => { store.name = ni.value.trim().slice(0, 24); save(); }); }
  if (location.hash === "#arbeitsblatt") { renderSheet(); return; }
  wireFooter();
  const d = data || {};
  if (d.name === "mission" && MISSIONS.some(m => m.id === d.mid)) startMission(d.mid, d.idx);
  else if (d.name === "train") startTrain(d.topic);
  else renderHome();
}
try {
  window.claude?.hot?.snapshot?.(() => ({ name: view.name, mid: view.m?.id, idx: view.idx, topic: view.topic }));
} catch (e) { /* kein Live-Update */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
</body>
