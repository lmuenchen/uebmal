<style>
/* Aussehen wie die bisherige Oberfläche von uebmal.de (stil.css) */
:root{
  --paper:#f4f7f3; --card:#ffffff; --ink:#16302b; --muted:#5b6f6a; --line:#d5e0db;
  --green:#1f8a5b; --green-ink:#ffffff; --marker:#ffe36e; --marker-ink:#3a3200;
  --ok:#17794b; --ok-bg:#dff3e7; --mid:#8a6100; --mid-bg:#fff1c9; --bad:#b3372e; --bad-bg:#fbe4e1; --soft:#e8f0ec;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0f1b18; --card:#182823; --ink:#e8f1ed; --muted:#9db3ac; --line:#2c423b;
    --green:#3fbf86; --green-ink:#062216; --marker:#e9c93d; --marker-ink:#1f1a00;
    --ok:#6fdca6; --ok-bg:#173b2b; --mid:#f0c75a; --mid-bg:#3d3212; --bad:#ff9a8f; --bad-bg:#472320; --soft:#20342e;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 56px}
.kopf{border-top:8px solid var(--green);padding:22px 0 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:2rem;line-height:1.1;margin:0}
h1 span{background:var(--marker);color:var(--marker-ink);padding:0 8px;border-radius:6px}
h2{font-size:1.15rem;margin:28px 0 10px}
h2.gross{font-size:1.5rem;margin-top:12px;line-height:1.2}
.sub{color:var(--muted);margin:6px 0 0}
.hinweis{background:var(--soft);border-left:5px solid var(--green);border-radius:8px;padding:12px 14px;margin:18px 0}
.hinweis .knopf{margin-left:6px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
a.kachel{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:inherit;text-decoration:none;min-height:96px}
a.kachel:hover,a.kachel:focus-visible{border-color:var(--green);outline:none}
a.kachel b{font-size:1.1rem}
a.kachel small{color:var(--muted)}
a.kachel .f{color:var(--green);font-weight:700;font-size:.85rem}
a.kachel.breit{grid-column:1/-1;background:var(--green);color:var(--green-ink);border-color:var(--green);min-height:0}
a.kachel.breit .f,a.kachel.breit small{color:var(--green-ink)}
a.kachel.zu{border-style:dashed;opacity:.7}
.knopf{font:inherit;font-weight:700;background:var(--green);color:var(--green-ink);border:0;border-radius:12px;padding:12px 20px;cursor:pointer}
.knopf.leise{background:none;color:var(--ink);border:1.5px solid var(--line);font-weight:400;padding:8px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.leiste{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 4px}
.leiste select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.zahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.zahl{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.zahl b{display:block;font-size:1.6rem;line-height:1.15;font-variant-numeric:tabular-nums}
.zahl span{color:var(--muted);font-size:.85rem}
.karte{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.rollen{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:700;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.neu td,tr.neu th{background:var(--mid-bg)}
.pille{display:inline-block;border-radius:999px;padding:1px 9px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.pille.gut{background:var(--ok-bg);color:var(--ok)}
.pille.mittel{background:var(--mid-bg);color:var(--mid)}
.pille.schwach{background:var(--bad-bg);color:var(--bad)}
.pille.grau{background:var(--soft);color:var(--muted)}
.text-eintrag{border-top:1px solid var(--line);padding:10px 0}
.text-eintrag:first-child{border-top:0}
.text-eintrag .frage{color:var(--muted);font-size:.9rem}
.klein{font-size:.85rem;color:var(--muted);font-weight:400}
summary{cursor:pointer;font-weight:700}

/* Trainer */
.faecher{display:flex;gap:3px;height:26px;margin-top:10px;border-radius:8px;overflow:hidden}
.faecher i{display:flex;align-items:center;justify-content:center;min-width:0;font-style:normal;font-size:.72rem;white-space:nowrap;overflow:hidden;color:var(--ink);background:var(--line)}
.faecher i span{padding:0 4px}
.faecher .f1{background:var(--bad-bg)} .faecher .f2{background:var(--mid-bg)} .faecher .f3{background:var(--soft)}
.faecher .f4{background:var(--ok-bg)} .faecher .f5{background:var(--green);color:var(--green-ink)}
.rkopf{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.balken{height:8px;background:var(--line);border-radius:99px;margin:10px 0 14px;overflow:hidden}
.balken i{display:block;height:100%;background:var(--green);border-radius:99px}
.frage{padding:18px}
.ftext{font-size:1.2rem;margin:10px 0 16px}
.ftext small{font-size:.85rem;color:var(--muted)}
.de{color:var(--muted);font-style:italic}
.satz{font-size:1.35rem;font-family:Georgia,"Times New Roman",serif}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.viele{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.opts{grid-template-columns:1fr}.opts.viele{grid-template-columns:1fr 1fr}}
.opt,.wort{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;min-height:48px}
.opt:hover:not(:disabled),.wort:hover:not(:disabled){border-color:var(--green)}
.opt[aria-pressed=true]{border-color:var(--green);background:var(--soft);font-weight:700}
.opt.ok,.wort.ok,input.ok,.ablage.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.nein,.wort.nein,input.nein,.ablage.nein{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled,.wort:disabled{cursor:default}
.gitter{margin-bottom:14px}
.gitter th{font-size:.95rem;color:var(--ink);vertical-align:middle}
.gitter td{padding:5px}
.gitter .opt{width:100%;text-align:center;padding:9px 6px;min-height:44px}
.wort{font-size:1.25rem;padding:8px 14px;margin:4px 2px}
.tippsatz{line-height:2.4}
.ablage{min-height:70px;border:2px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center}
.vorrat{margin-bottom:14px}
.vorrat .wort:disabled{opacity:.25}
.tform{display:flex;gap:10px;flex-wrap:wrap}
.tform input{flex:1;min-width:180px;font:inherit;font-size:1.25rem;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:11px 13px}
#rueck{margin-top:16px}
#rueck .gut,#rueck .schlecht{border-radius:10px;padding:10px 12px;margin-bottom:12px}
#rueck .gut{background:var(--ok-bg);color:var(--ok)}
#rueck .schlecht{background:var(--bad-bg);color:var(--bad)}
#rueck span,#rueck small{color:var(--ink)}

/* Mathe */
.gross{font-size:1.5rem;display:inline-block;margin-top:6px}
.wort{font-family:inherit}
b.wort{font-size:1.15rem;border:0;background:none;padding:0;margin:0;cursor:auto;display:inline}
.ftext{font-size:1.15rem;margin:10px 0 16px}
.ftext.klein2{font-size:1rem;margin:4px 0 8px}
.opts.lang{grid-template-columns:1fr}
.tform .vor{align-self:center;font-size:1.3rem;font-weight:700}
.tform input{font-family:inherit;font-variant-numeric:tabular-nums}
.merk{margin:0;padding-left:20px}.merk li{margin:6px 0}
.falle{background:var(--mid-bg);color:var(--ink);border-radius:8px;padding:8px 12px;margin:12px 0 0}
.strahl{width:100%;height:auto;margin:10px 0;display:block}
.strahl .achse,.strahl .strich{stroke:var(--ink);stroke-width:2}
.strahl .spitze{fill:var(--ink)}
.strahl .zahl{fill:var(--ink);font-size:17px;text-anchor:middle;font-family:inherit}
.strahl .buchstabe{fill:var(--bad);font-size:18px;font-weight:700;text-anchor:middle}
.strahl .pfeil{fill:var(--bad)}
.strahl .feld{fill:transparent;cursor:pointer}
.strahl:not(.fertig) .feld:hover{fill:var(--green);opacity:.18}
.strahl .feld.ok{fill:var(--ok);opacity:.35}.strahl .feld.nein{fill:var(--bad);opacity:.35}
.mauer{margin:14px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mauer div{display:flex;gap:4px}
.mauer span{min-width:78px;text-align:center;padding:8px 6px;border:2px solid var(--line);border-radius:6px;background:var(--soft);font-weight:700;font-variant-numeric:tabular-nums}
.mauer span.leer{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.spalten{display:table;margin:12px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.5rem;line-height:1.35}
.spalten div{display:flex;justify-content:flex-end}
.spalten span{width:.95em;text-align:center}.spalten i{font-style:normal;margin-right:auto;padding-right:.6em}
.spalten hr{border:0;border-top:3px solid var(--ink);margin:2px 0}
.pkarten{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.pkarten span{width:64px;height:88px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;border-radius:10px;border:2px solid var(--line);background:var(--card)}
.pkarten .plus{color:var(--ok);border-color:var(--ok)}.pkarten .minus{color:var(--bad);border-color:var(--bad)}
</style>

<script>

/* üb mal · Mathe Delta 5 – Aufgaben zu Kapitel 1 und 2 (ohne Oberfläche) */
"use strict";

function zufall(n) { return Math.floor(Math.random() * n); }
function zw(a, b) { return a + zufall(b - a + 1); }
function wahl(a) { return a[zufall(a.length)]; }
function misch(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = zufall(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function einzig(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

/* Zahl schön schreiben: Dreierblöcke, echtes Minuszeichen */
function z(n) {
  var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (n < 0 ? "−" : "") + s;
}
function vz(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + z(Math.abs(n)); }   /* mit Vorzeichen */
function kl(n) { return "(" + (n === 0 ? "0" : vz(n)) + ")"; }                  /* (+5), (−3) */
/* Eingabe lesen: Leerzeichen, Punkte, Pluszeichen weg; alle Minus-Arten erlaubt */
function lies(s) {
  s = String(s).replace(/[\s  .']/g, "").replace(/[−–—]/g, "-").replace(/^\+/, "");
  return /^-?\d+$/.test(s) ? parseInt(s, 10) : NaN;
}

/* ---------- Zahlwörter ---------- */
var EINER = ["", "ein", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
var ZEHNER = ["", "", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];
function unter1000(n) {
  var s = "", h = Math.floor(n / 100), r = n % 100;
  if (h) s += EINER[h] + "hundert";
  if (r < 20) s += EINER[r];
  else s += (r % 10 ? EINER[r % 10] + "und" : "") + ZEHNER[Math.floor(r / 10)];
  return s;
}
function zahlwort(n) {
  if (n === 0) return "null";
  var teile = [], bio = Math.floor(n / 1e12), mrd = Math.floor(n / 1e9) % 1000, mio = Math.floor(n / 1e6) % 1000, tsd = Math.floor(n / 1000) % 1000, rest = n % 1000;
  function gross(k, ein, mehr) { if (k) teile.push(k === 1 ? "eine " + ein : unter1000(k) + " " + mehr); }
  gross(bio, "Billion", "Billionen"); gross(mrd, "Milliarde", "Milliarden"); gross(mio, "Million", "Millionen");
  var klein = (tsd ? unter1000(tsd) + "tausend" : "") + unter1000(rest);
  if (rest % 100 === 1) klein += "s";            /* …eins am Ende */
  if (klein) teile.push(klein);
  return teile.join(" ");
}

/* ---------- Themen ---------- */
var THEMEN = [
  { id: "zm", kap: "1.1", titel: "Zahlen und Mengen",
    merk: ["ℕ = {1; 2; 3; …} sind die natürlichen Zahlen. Die 0 gehört nicht dazu: 0 ∉ ℕ, aber 0 ∈ ℕ₀.",
      "ℤ = {…; −2; −1; 0; 1; 2; …} sind die ganzen Zahlen. Jede natürliche Zahl ist auch eine ganze Zahl.",
      "Jede natürliche Zahl hat einen Nachfolger. Einen Vorgänger in ℕ hat jede außer der 1.",
      "Quadratzahlen entstehen, wenn man eine Zahl mit sich selbst malnimmt: 1, 4, 9, 16, 25, …"],
    falle: "Bei Nachfolger und Vorgänger auf die Neunen und Nullen achten: Nachfolger von 199 999 ist 200 000." },
  { id: "zs", kap: "1.2", titel: "Zahlenstrahl und Zahlengerade",
    merk: ["Erst herausfinden, wie groß ein Schritt ist: Abstand zweier beschrifteter Zahlen durch die Anzahl der Schritte dazwischen teilen.",
      "Je weiter rechts eine Zahl liegt, desto größer ist sie. Das gilt auch für negative Zahlen."],
    falle: "Nicht einfach in Einerschritten zählen. Ein Strich kann 2, 5, 10 oder 100 bedeuten." },
  { id: "gz", kap: "1.3", titel: "Große Zahlen und Stellenwerte",
    merk: ["Stufenzahlen: Tausend (3 Nullen), Million (6 Nullen), Milliarde (9 Nullen), Billion (12 Nullen).",
      "Der Wert einer Ziffer hängt von ihrer Stelle ab. Die Stellenwerttafel hilft: … HT ZT T | H Z E.",
      "Große Zahlen in Dreierblöcken von rechts schreiben und fehlende Stellen mit Nullen füllen."],
    falle: "Nullen nicht vergessen: vier Millionen siebzig ist 4 000 070 und nicht 4 070." },
  { id: "ru", kap: "1.4", titel: "Runden und Überschlagen",
    merk: ["Nur die Ziffer rechts von der Rundungsstelle entscheidet.", "Bei 0, 1, 2, 3, 4 wird abgerundet, bei 5, 6, 7, 8, 9 aufgerundet.",
      "Alle Stellen rechts von der Rundungsstelle werden zu Nullen.", "Beim Überschlag rundet man zuerst und rechnet dann im Kopf."],
    falle: "Nie schrittweise runden. 749 auf Hunderter ist 700, auch wenn 749 auf Zehner 750 wäre." },
  { id: "go", kap: "1.5/1.6", titel: "Ganze Zahlen ordnen",
    merk: ["Negative Zahlen liegen links von der Null. Von zwei Zahlen ist die größer, die weiter rechts liegt.",
      "Bei negativen Zahlen gilt: Je größer der Betrag, desto kleiner die Zahl. −12 < −9.",
      "Der Betrag ist der Abstand zur Null und nie negativ: |−5| = 5.", "Zahl und Gegenzahl haben denselben Betrag: Gegenzahl von −5 ist 5."],
    falle: "−12 °C ist kälter als −9 °C, also ist −12 die kleinere Zahl." },
  { id: "fk", kap: "2.1/2.2", titel: "Fachbegriffe und geschicktes Rechnen",
    merk: ["Addition: Summand + Summand = Summe. Subtraktion: Minuend − Subtrahend = Differenz.",
      "Beim Addieren darf man vertauschen und beliebig Klammern setzen (Kommutativ- und Assoziativgesetz).",
      "Rechenvorteil: zuerst Zahlen zusammenfassen, die glatte Hunderter oder Tausender ergeben."],
    falle: "„Subtrahiere 20 von 50“ heißt 50 − 20. Beim Subtrahieren darf man nicht vertauschen." },
  { id: "sr", kap: "2.1/2.2", titel: "Schriftlich rechnen",
    merk: ["Stellengerecht untereinanderschreiben: Einer unter Einer, Zehner unter Zehner.", "Von rechts nach links rechnen und Überträge notieren.",
      "Vorher überschlagen, danach mit der Umkehraufgabe die Probe machen."],
    falle: "Bei Nullen im Minuenden genau auf die Überträge achten, zum Beispiel bei 80 073 − 6 027." },
  { id: "kt", kap: "2.3/2.4", titel: "Klammern und Terme",
    merk: ["Was in Klammern steht, wird zuerst gerechnet. Bei mehreren Klammern die innere zuerst.", "Ohne Klammern rechnet man von links nach rechts.",
      "Die letzte Rechnung bestimmt die Art des Terms: (537 − 171) + 93 ist eine Summe."],
    falle: "Ein Minus vor der Klammer ändert alles: 36 − (18 − 6) = 24, aber 36 − 18 − 6 = 12." },
  { id: "gl", kap: "2.5", titel: "Gleichungen",
    merk: ["Die Lösung ist die Zahl, die die Gleichung wahr macht.", "Lösen mit der Umkehraufgabe: x + 23 = 56, also x = 56 − 23.",
      "Immer die Probe machen: Lösung einsetzen und nachrechnen."],
    falle: "Bei 25 − x = 13 steht x hinten. Dann ist x = 25 − 13 und nicht 25 + 13." },
  { id: "ga", kap: "2.6–2.8", titel: "Ganze Zahlen addieren und subtrahieren",
    merk: ["Addieren an der Zahlengeraden: Plus eine positive Zahl heißt nach rechts gehen, plus eine negative Zahl nach links.",
      "Gleiche Vorzeichen: Beträge addieren, Vorzeichen behalten. (−3) + (−5) = −8.",
      "Verschiedene Vorzeichen: Beträge subtrahieren, das Vorzeichen der Zahl mit dem größeren Betrag gewinnt. (−3) + (+5) = +2.",
      "Subtrahieren heißt die Gegenzahl addieren: (−3) − (−5) = (−3) + (+5) = +2."],
    falle: "Minus minus wird zu plus: 4 − (−6) = 4 + 6 = 10." }
];
function thema(id) { return THEMEN.filter(function (t) { return t.id === id; })[0]; }

/* ---------- Bausteine für die Anzeige ---------- */
function frageWahl(t, frage, richtig, falsche, extra) {
  var opts = extra && extra.fest ? extra.fest : misch(einzig([richtig].concat(falsche)).slice(0, 4));
  var q = { t: t, art: "wahl", frage: frage, opts: opts, ok: opts.indexOf(richtig), loesung: richtig };
  for (var k in extra || {}) q[k] = extra[k];
  return q;
}
function frageZahl(t, frage, n, extra) {
  var q = { t: t, art: "text", frage: frage, zahl: n, loesung: "<b>" + z(n) + "</b>" };
  for (var k in extra || {}) q[k] = extra[k];
  return q;
}
function wahrFalsch(t, aussage, wahr, erkl) {
  return { t: t, art: "wahl", frage: "Wahr oder falsch?<br><b class='gross'>" + aussage + "</b>", opts: ["wahr", "falsch"], ok: wahr ? 0 : 1, loesung: wahr ? "Das ist wahr." : "Das ist falsch.", erkl: erkl };
}

/* Zahlenstrahl als Grafik. o = {min, schritt, n, beschriftet:[Index…], marke: Index, tippbar: bool} */
function strahlSvg(o) {
  var B = 700, x0 = 30, x1 = 670, dx = (x1 - x0) / (o.n - 1), s = "<svg class='strahl' viewBox='0 0 " + B + " 110' role='img' aria-label='Zahlengerade'>";
  s += "<line x1='10' y1='60' x2='690' y2='60' class='achse'/><path d='M690 60 l-9 -5 v10 z' class='spitze'/>";
  for (var i = 0; i < o.n; i++) {
    var x = x0 + i * dx, lang = o.beschriftet.indexOf(i) >= 0;
    s += "<line x1='" + x + "' y1='" + (lang ? 46 : 52) + "' x2='" + x + "' y2='" + (lang ? 74 : 68) + "' class='strich'/>";
    if (lang) s += "<text x='" + x + "' y='96' class='zahl'>" + z(o.min + i * o.schritt) + "</text>";
    if (o.tippbar) s += "<rect x='" + (x - dx / 2) + "' y='22' width='" + dx + "' height='66' class='feld' data-i='" + i + "'/>";
  }
  if (o.marke != null) { var mx = x0 + o.marke * dx; s += "<path d='M" + mx + " 44 l-7 -14 h14 z' class='pfeil'/><text x='" + mx + "' y='22' class='buchstabe'>A</text>"; }
  return s + "</svg>";
}
